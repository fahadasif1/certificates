:root{
  --red:#D11E35; --ink:#1F1E26; --paper:#FAFAFD; --body:#4A5568; --muted:#7A7F8E;
  --pill:#C6C9D4; --card:#F1F2FB; --line:#D8DAE5; --stage:#E6E7EE;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Manrope',system-ui,sans-serif;color:var(--ink);background:var(--stage);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:350px minmax(0,1fr);min-height:100%}

/* Form */
.form{background:#fff;border-right:1px solid var(--line);padding:22px 22px 28px;height:100vh;overflow:auto;position:sticky;top:0}
.form h1{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0 0 3px}
.form h1 b{color:var(--red);font-weight:700}
.form .sub{font-size:13px;color:var(--muted);margin:0 0 18px;line-height:1.45}
.group{padding-top:14px;margin-top:14px;border-top:1px solid var(--line)}
.group>h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 10px}
label{display:block;font-size:12.5px;font-weight:600;margin:0 0 11px}
label span{display:block;margin-bottom:4px}
input,select,textarea{width:100%;font:500 14px/1.4 'Manrope',system-ui,sans-serif;color:var(--ink);background:var(--card);border:1px solid transparent;border-radius:9px;padding:9px 11px}
textarea{resize:vertical;min-height:96px}
input:focus,select:focus,textarea:focus{outline:none;background:#fff;border-color:var(--red);box-shadow:0 0 0 3px rgba(209,30,53,.14)}
.big{font-size:16px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.two label{margin-bottom:9px}
.pages{border:0;padding:0;margin:0 0 4px}
.pages legend{font-size:12.5px;font-weight:600;padding:0;margin-bottom:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);border-radius:10px;padding:4px}
.seg label{margin:0;position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;padding:0;cursor:pointer}
.seg span{display:flex;align-items:center;justify-content:center;gap:7px;margin:0;padding:8px 6px;border-radius:7px;font-size:13px;font-weight:700;color:var(--body)}
.seg i{display:block;border:1.6px solid currentColor;border-radius:2px}
.seg .l{width:17px;height:12px}
.seg .p{width:12px;height:17px}
.seg input:checked+span{background:#fff;color:var(--red);box-shadow:0 1px 3px rgba(31,30,38,.16)}
.seg.four{grid-template-columns:repeat(4,1fr)}
.seg.four span{flex-direction:column;gap:4px;padding:7px 2px;font-size:11.5px}
.seg i.dot{width:14px;height:14px;border:0;border-radius:50%;background:var(--c)}
.seg input:focus-visible+span{outline:3px solid rgba(209,30,53,.4);outline-offset:1px}
.btns{display:flex;gap:8px;margin-top:16px}
button{font:700 14px 'Manrope',system-ui,sans-serif;border:0;border-radius:999px;padding:12px 16px;cursor:pointer}
.go{flex:1;background:var(--red);color:#fff}
.go:hover{background:#B5172B}
.next{background:var(--card);color:var(--ink)}
.next:hover{background:#E4E6F4}
button:focus-visible{outline:3px solid rgba(209,30,53,.4);outline-offset:2px}

/* Preview */
.stage{padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.fitbox{position:relative;box-shadow:0 18px 50px rgba(31,30,38,.22)}
.hint{font-size:13px;color:var(--body);margin:14px 0 0;text-align:center}

/* Certificate: A4 landscape */
.sheet{position:absolute;top:0;left:0;transform-origin:0 0;width:297mm;height:210mm;background:var(--paper);overflow:hidden;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.band{position:absolute;inset:0 0 auto 0;height:7.5mm;background:var(--red);color:#fff;font-size:8.6pt;font-weight:600;display:flex;align-items:center;justify-content:center;letter-spacing:.01em;z-index:3}
.side{position:absolute;left:0;top:7.5mm;bottom:0;width:84mm;background:var(--card);overflow:hidden;color:var(--ink)}
.side .logo{position:absolute;left:13mm;top:13mm;width:50mm;height:auto;fill:var(--ink)}
.side .orb{position:absolute;left:-47mm;top:38mm;width:122mm;height:126.1mm;fill:var(--red)}
.sheet.pale .orb{fill:#F6D5DA}
.side .where{position:absolute;left:13mm;right:10mm;bottom:12mm}
.where .ev{font-size:12.5pt;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.where .ci{font-size:9.2pt;font-weight:500;color:var(--body);margin-top:1.6mm;line-height:1.4}
.main{position:absolute;left:84mm;right:0;top:7.5mm;bottom:0;padding:15mm 19mm 11mm 20mm;display:flex;flex-direction:column}
.pill{align-self:flex-start;background:var(--pill);border-radius:99px;padding:1.7mm 4.6mm;font-size:8.8pt;font-weight:700;letter-spacing:.17em;text-transform:uppercase}
.award{font-size:58pt;font-weight:600;letter-spacing:-.045em;line-height:1.1;margin-top:8mm;white-space:nowrap;min-height:1.1em}
.award i{font-style:normal;color:var(--red)}
.to{font-size:12.5pt;font-weight:500;color:var(--muted);margin-top:12mm}
.name{font-size:46pt;font-weight:700;letter-spacing:-.03em;line-height:1.2;margin-top:1.5mm;white-space:nowrap;min-height:1.2em}
.rule{width:28mm;height:1.2mm;border-radius:1mm;background:var(--red);margin-top:5mm;flex:none}
.why{font-size:14.5pt;font-weight:500;line-height:1.55;color:var(--body);margin-top:7mm;max-width:170mm;flex:0 0 auto}
.foot{margin-top:auto;display:flex;align-items:flex-end;gap:9mm;padding-top:4mm;min-height:36mm}
.stamp{position:absolute;left:77mm;bottom:6.5mm;width:38mm;height:38mm;transform:rotate(-11deg);pointer-events:none;mix-blend-mode:multiply}
.sig{width:58mm;flex:none}
.sig .pen{height:13mm;border-bottom:.35mm solid var(--ink);position:relative}
.sign{position:absolute;left:1mm;bottom:-1.3mm;width:57mm;height:auto;overflow:visible;pointer-events:none;fill:#1B2A5A;stroke:#1B2A5A;stroke-width:3}
.sig .nm{font-size:10.5pt;font-weight:700;margin-top:1.8mm;height:1.3em;line-height:1.3;white-space:nowrap}
.sig .rl{font-size:9pt;font-weight:500;color:var(--muted);height:1.3em;line-height:1.3;white-space:nowrap}
.when{margin-left:auto;text-align:right;white-space:nowrap}
.when .web{font-size:9pt;font-weight:500;color:var(--muted);line-height:1.3;min-height:1.3em}
.off{display:none}


[contenteditable]{outline:none;border-radius:3px;cursor:text}
[contenteditable]:hover{box-shadow:0 0 0 1.5px rgba(209,30,53,.28)}
[contenteditable]:focus{box-shadow:0 0 0 2px rgba(209,30,53,.6)}
[contenteditable]:empty::before{content:attr(data-ph);color:#B4B7C4;font-weight:inherit}
.side [contenteditable]:empty::before{color:#6F7080}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .form{height:auto;position:static;border-right:0;border-bottom:1px solid var(--line);padding:18px 16px}
  .stage{padding:18px 16px}
}
@page{size:A4 landscape;margin:0}
@media print{
  html,body{background:#fff;height:auto}
  .form,.hint{display:none!important}
  .app{display:block}
  .stage{padding:0;display:block}
  .fitbox{box-shadow:none;width:297mm!important;height:209.8mm!important;overflow:hidden}
  .fitbox.flipped{width:210mm!important;height:296.8mm!important}
  .sheet{transform:none!important}
  .sheet.flipped{transform:translateX(210mm) rotate(90deg)!important}
  [contenteditable]{box-shadow:none!important}
  [contenteditable]:empty::before{content:none}
}

<script>
(function () {
  var AWARDS = [
    ['Top Performer', "For outstanding results throughout the Master's Scholarship Evenings, and for setting the standard the whole team worked towards."],
    ['Registration Champion', 'For bringing in an exceptional number of student registrations and helping to fill the room at our Scholarship Evenings.'],
    ['Turnout Champion', 'For turning registrations into real attendance, following up with students with care so that they arrived on the night.'],
    ['Student Care Champion', 'For the patience and kindness shown to every student, answering their questions and making each one feel welcome and supported.'],
    ['Event Night Star', "For energy, calm and professionalism on the night, at the door and on the floor, which made every guest's evening run smoothly."],
    ['Behind the Scenes Hero', 'For the quiet, careful work that guests never saw, but that every one of our Scholarship Evenings depended on.'],
    ['Team Player', 'For always stepping in to support colleagues, sharing the load, and lifting the spirit of the whole team.'],
    ['Problem Solver', 'For staying calm under pressure and finding a way forward whenever something unexpected came up.'],
    ['Above and Beyond', 'For giving far more than was asked, with long hours and real commitment to making these evenings a success.'],
    ['Rising Star', 'For impressive enthusiasm, fast learning and a contribution well beyond what we expected at this stage.'],
    ['Marketing Excellence', 'For creative, effective marketing that reached students across the UK and gave them a reason to join us.'],
    ['Leadership Excellence', 'For leading with clarity and care, keeping the team focused and confident from planning through to the final evening.'],
    ['Best Brand Team', 'For an outstanding combined effort that brought students, energy and pride to our Scholarship Evenings.'],
    ['Outstanding Contribution', "For a valued contribution to the Master's Scholarship Evenings. Thank you for your hard work and dedication."]
  ];
  var CUSTOM = 'Your own award';
  var DEFAULTS = {
    name: '', award: AWARDS[0][0], why: AWARDS[0][1],
    event: "Master's Scholarship Evenings 2026", cities: 'London · Manchester · Birmingham',
    n1: 'Shahzad Anwar', r1: 'Director', page: 'landscape', design: 'a', stamp: 'blue'
  };
  var KEEP = ['event', 'cities', 'page', 'design', 'stamp'];
  var STORE = 'scorp-certificate-v1';
  var s = Object.assign({}, DEFAULTS);
  try {
    var saved = JSON.parse(localStorage.getItem(STORE) || '{}');
    KEEP.forEach(function (k) { if (typeof saved[k] === 'string') s[k] = saved[k]; });
  } catch (e) {}

  var $ = function (q) { return document.querySelector(q); };
  var $$ = function (q) { return Array.prototype.slice.call(document.querySelectorAll(q)); };
  var pick = $('#pick');

  AWARDS.forEach(function (a) { pick.add(new Option(a[0], a[0])); });
  pick.add(new Option(CUSTOM, CUSTOM));

  function setTwoTone(el, text) {
    var words = text.trim().split(/\s+/);
    var last = words.pop() || '';
    el.textContent = words.length ? words.join(' ') + ' ' : '';
    if (last) { var i = document.createElement('i'); i.textContent = last; el.appendChild(i); }
  }

  function fitLine(el, max, min) {
    var size = max;
    el.style.fontSize = size + 'pt';
    while (el.scrollWidth > el.clientWidth + 1 && size > min) { size -= 1; el.style.fontSize = size + 'pt'; }
  }

  function fitAll() {
    fitLine($('#award'), 58, 24);
    fitLine($('#name'), 46, 15);
    var why = $('#why'), main = $('#main'), size = 14.5;
    why.style.fontSize = size + 'pt';
    while (main.scrollHeight > main.clientHeight + 1 && size > 9) { size -= 0.4; why.style.fontSize = size + 'pt'; }
  }

  function syncPick() {
    var match = AWARDS.filter(function (a) { return a[0] === s.award.trim(); })[0];
    pick.value = match ? match[0] : CUSTOM;
  }

  function render() {
    $$('[data-f]').forEach(function (el) {
      if (el === document.activeElement) return;
      var v = s[el.dataset.f] || '';
      if (el.dataset.f === 'award') setTwoTone(el, v); else el.textContent = v;
    });
    $$('[data-k]').forEach(function (el) {
      if (el !== document.activeElement) el.value = s[el.dataset.k] || '';
    });
    $('#sig1').classList.toggle('off', !s.n1.trim() && !s.r1.trim());
    $('#sign').classList.toggle('off', s.n1.trim() !== DEFAULTS.n1);
    syncPick();
    fitAll();
    document.title = s.name.trim() ? 'Certificate - ' + s.name.trim() + ' - ' + s.award.trim() : 'Scorp Certificate';
    try {
      var keep = {}; KEEP.forEach(function (k) { keep[k] = s[k]; });
      localStorage.setItem(STORE, JSON.stringify(keep));
    } catch (e) {}
  }

  pick.addEventListener('change', function () {
    if (pick.value === CUSTOM) {
      s.award = ''; s.why = '';
      render();
      $('[data-k="award"]').focus();
      return;
    }
    var a = AWARDS.filter(function (x) { return x[0] === pick.value; })[0];
    s.award = a[0]; s.why = a[1];
    render();
  });

  $$('[data-k]').forEach(function (el) {
    el.addEventListener('input', function () { s[el.dataset.k] = el.value; render(); });
  });

  $$('[data-f]').forEach(function (el) {
    el.setAttribute('contenteditable', 'true');
    el.setAttribute('spellcheck', 'false');
    el.setAttribute('role', 'textbox');
    el.setAttribute('aria-label', el.dataset.ph);
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } });
    el.addEventListener('paste', function (e) {
      e.preventDefault();
      var text = (e.clipboardData || window.clipboardData).getData('text').replace(/\s*\n\s*/g, ' ');
      document.execCommand('insertText', false, text);
    });
    el.addEventListener('input', function () { s[el.dataset.f] = el.textContent.replace(/ /g, ' '); render(); });
    el.addEventListener('blur', function () {
      s[el.dataset.f] = el.textContent.replace(/ /g, ' ').trim();
      if (!s[el.dataset.f]) el.textContent = '';
      render();
    });
  });

  $('#print').addEventListener('click', function () { if (document.activeElement) document.activeElement.blur(); render(); window.print(); });
  $('#next').addEventListener('click', function () { if (document.activeElement) document.activeElement.blur(); s.name = ''; render(); $('[data-k="name"]').focus(); });

  var box = $('#fitbox'), sheet = $('#sheet');
  var pageRule = document.createElement('style');
  document.head.appendChild(pageRule);
  function setPage(page) {
    s.page = page === 'flipped' ? 'flipped' : 'landscape';
    var flipped = s.page === 'flipped';
    sheet.classList.toggle('flipped', flipped);
    box.classList.toggle('flipped', flipped);
    pageRule.textContent = '@page{size:A4 ' + (flipped ? 'portrait' : 'landscape') + ';margin:0}';
    $('#hint').textContent = flipped
      ? 'Prints turned sideways on an A4 portrait page. Use the form to edit the text.'
      : 'You can also click any text on the certificate and type over it.';
    $$('input[name="page"]').forEach(function (r) { r.checked = r.value === s.page; });
  }
  $$('input[name="page"]').forEach(function (r) {
    r.addEventListener('change', function () { setPage(r.value); render(); scale(); });
  });
  function scale() {
    var stage = box.parentElement, cs = getComputedStyle(stage);
    var w = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var wide = window.innerWidth > 900;
    var h = wide ? window.innerHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 40 : Infinity;
    var sw = sheet.offsetWidth, sh = sheet.offsetHeight, flipped = s.page === 'flipped';
    var pw = flipped ? sh : sw, ph = flipped ? sw : sh;
    var k = Math.min(w / pw, h / ph, 1.4);
    box.style.width = pw * k + 'px';
    box.style.height = ph * k + 'px';
    sheet.style.transform = flipped
      ? 'translateX(' + pw * k + 'px) rotate(90deg) scale(' + k + ')'
      : 'scale(' + k + ')';
  }
  window.addEventListener('resize', scale);
  window.addEventListener('beforeprint', function () { sheet.style.transform = 'none'; });
  window.addEventListener('afterprint', scale);

  function setDesign(design) {
    s.design = design === 'b' ? 'b' : 'a';
    $('#sheet').classList.toggle('pale', s.design === 'b');
    $$('input[name="design"]').forEach(function (r) { r.checked = r.value === s.design; });
  }
  $$('input[name="design"]').forEach(function (r) {
    r.addEventListener('change', function () { setDesign(r.value); render(); });
  });

  var STAMP_INK = { burgundy: '#6E1423', blue: '#14328C', red: '#C8102E', golden: '#A67C00' };
  var stampImg = $('#stamp'), stampBase = new Image();
  function paintStamp() {
    if (!stampBase.naturalWidth) return;
    var c = document.createElement('canvas');
    c.width = stampBase.naturalWidth; c.height = stampBase.naturalHeight;
    var x = c.getContext('2d');
    x.drawImage(stampBase, 0, 0);
    x.globalCompositeOperation = 'source-in';
    x.fillStyle = STAMP_INK[s.stamp];
    x.fillRect(0, 0, c.width, c.height);
    stampImg.src = c.toDataURL('image/png');
  }
  function setStamp(colour) {
    s.stamp = STAMP_INK[colour] ? colour : 'blue';
    $$('input[name="stamp"]').forEach(function (r) { r.checked = r.value === s.stamp; });
    paintStamp();
  }
  $$('input[name="stamp"]').forEach(function (r) {
    r.addEventListener('change', function () { setStamp(r.value); render(); });
  });
  stampBase.onload = paintStamp;
  stampBase.src = stampImg.src;

  setDesign(s.design);
  setStamp(s.stamp);
  setPage(s.page);
  render();
  scale();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fitAll(); scale(); });
  $('[data-k="name"]').focus();
})();
</script>
